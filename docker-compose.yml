services:
  postgres:
    image: postgres:16-alpine
    container_name: compregado-postgres-dev
    environment:
      POSTGRES_DB: compregado
      POSTGRES_USER: compregado
      POSTGRES_PASSWORD: compregado
    ports:
      - "5432:5432"
    volumes:
      - compregado_pg:/var/lib/postgresql/data

volumes:
  compregado_pg:
    name: compregado_pg_dev
