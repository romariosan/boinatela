# CompreGado — stack de produção (VPS).
#
#   internet ──443──▶ Nginx (na VPS, fora do Docker; ver deploy/nginx/nginx-compregado.conf)
#                       ├─ appcompregado.com.br      ──▶ /var/www/appcompregado (build web do Ionic)
#                       └─ api.appcompregado.com.br  ──▶ 127.0.0.1:8080 ──▶ compregado-api
#                                                                              │  ▲
#   compregado-api ──▶ postgres (bancos "compregado" e "evolution")  sendText ▼  │ webhook MESSAGES_UPSERT
#                                                                        evolution-api ──▶ WhatsApp
#
# Persistência: tudo que importa fica em volumes nomeados (seção "volumes" no fim).
#   docker compose down        -> remove só os containers; os volumes ficam.
#   docker compose down -v     -> APAGA os volumes (banco, fotos e sessão do WhatsApp). Não use em produção.
# Portas: nenhum container fica exposto para a internet. API, Postgres e Evolution escutam apenas no
# 127.0.0.1 da VPS; quem atende a internet é o Nginx. O Docker ignora o UFW ao publicar portas,
# por isso o bind em 127.0.0.1 é o que realmente protege.
#
# STACK_NOME (padrão "compregado") prefixa projeto, containers, rede e volumes. O build-e-teste.sh
# usa "compregado-teste" para subir uma cópia isolada sem tocar nos dados de produção.

name: ${STACK_NOME:-compregado}

# Rotação de logs: sem isso, os logs dos containers crescem até encher o disco da VPS.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-seguranca: &seguranca
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true
  networks:
    - compregado-net

services:
  # ------------------------------------------------------------------------------------------
  # PostgreSQL único: banco "compregado" (API) e banco "evolution" (Evolution API, usuário próprio).
  # ------------------------------------------------------------------------------------------
  postgres:
    <<: *seguranca
    image: postgres:16-alpine
    container_name: ${STACK_NOME:-compregado}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compregado}
      POSTGRES_USER: ${POSTGRES_USER:-compregado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Só no loopback da VPS, para um cliente SQL via túnel SSH. Nunca 0.0.0.0.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Roda a cada "up" e termina: cria (ou atualiza a senha de) o usuário e o banco da Evolution.
  # O /docker-entrypoint-initdb.d do Postgres só roda com o volume vazio; este passo vale também
  # para um volume que já tem dados.
  postgres-init:
    image: postgres:16-alpine
    container_name: ${STACK_NOME:-compregado}-postgres-init
    restart: "no"
    logging: *logging
    networks:
      - compregado-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-compregado}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-compregado}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:?defina EVOLUTION_DB_PASSWORD no .env}
    volumes:
      - ./scripts/init-evolution-db.sh:/init-evolution-db.sh:ro
    entrypoint: ["sh", "/init-evolution-db.sh"]

  # ------------------------------------------------------------------------------------------
  # Evolution API: o WhatsApp do bot (como um WhatsApp Web).
  # A sessão (o "QR Code lido") fica em DUAS partes, e as duas são persistidas:
  #   - credenciais e dados da instância no banco "evolution" (volume postgres_data);
  #   - chaves de criptografia em /evolution/instances (volume evolution_instances).
  # Perder qualquer uma das duas obriga a ler o QR Code de novo.
  # ------------------------------------------------------------------------------------------
  evolution-api:
    <<: *seguranca
    image: evoapicloud/evolution-api:v2.3.7
    container_name: ${STACK_NOME:-compregado}-evolution
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      SERVER_URL: ${EVOLUTION_URL:-http://localhost:8081}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      # Tem que ser "*": com uma lista, a Evolution recusa requisições sem header Origin, que são
      # justamente as da API do CompreGado e do healthcheck. A proteção é a apikey + bind em 127.0.0.1.
      CORS_ORIGIN: "*"
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "true"
      # Não apagar a instância quando o celular desconecta: basta reconectar.
      DEL_INSTANCE: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      # Senha só com letras e números (openssl rand -hex): ela vai dentro desta URL.
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: compregado
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      # Sem Redis: cache em memória. A sessão continua no banco e no volume.
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "false"
      # Nome que aparece no celular em "Aparelhos conectados".
      CONFIG_SESSION_PHONE_CLIENT: CompreGado
      CONFIG_SESSION_PHONE_NAME: Chrome
      LANGUAGE: pt-BR
      LOG_LEVEL: ERROR,WARN
    # Painel /manager via túnel SSH: ssh -L 8081:127.0.0.1:8081 root@IP-DA-VPS
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-8081}:8080"
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: ${EVOLUTION_MEM_LIMIT:-768m}

  # ------------------------------------------------------------------------------------------
  # API Spring Boot (perfil prod: sem seed, segredos só por variável de ambiente).
  # O Nginx da VPS faz o HTTPS e repassa para 127.0.0.1:${API_PORT}.
  # ------------------------------------------------------------------------------------------
  compregado-api:
    <<: *seguranca
    build: ../backend
    image: ${STACK_NOME:-compregado}-api:latest
    container_name: ${STACK_NOME:-compregado}-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-compregado}
      DB_USERNAME: ${POSTGRES_USER:-compregado}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://appcompregado.com.br,https://www.appcompregado.com.br,https://localhost,capacitor://localhost}
      WHATSAPP_WEBHOOK_TOKEN: ${WHATSAPP_WEBHOOK_TOKEN:?defina WHATSAPP_WEBHOOK_TOKEN no .env}
      ROBO_TOKEN: ${ROBO_TOKEN:?defina ROBO_TOKEN no .env}
      WHATSAPP_BOT_NUMERO: ${WHATSAPP_BOT_NUMERO:-}
    # Só no loopback: o Nginx da própria VPS é o único cliente.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
    # O heap do Java fica em 75% deste limite; o resto da RAM é do Postgres, da Evolution e do sistema.
    mem_limit: ${API_MEM_LIMIT:-1g}

networks:
  compregado-net:
    name: ${STACK_NOME:-compregado}-net
    driver: bridge

# Nomes fixos (prefixados por STACK_NOME): não dependem da pasta, e o backup-full.sh os referencia.
volumes:
  postgres_data:
    name: ${STACK_NOME:-compregado}_pg_data
  uploads:
    name: ${STACK_NOME:-compregado}_uploads
  evolution_instances:
    name: ${STACK_NOME:-compregado}_evolution_instances
