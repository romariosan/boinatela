# =============================================================================================
# CompreGado — Nginx (landing em / + API ofuscada em /apiC → Spring Boot em 127.0.0.1:8080)
#
# Instalação (ver DEPLOY_VPS.md):
#   sudo cp deploy/nginx/appcompregado.conf /etc/nginx/sites-available/appcompregado
#   sudo ln -sf /etc/nginx/sites-available/appcompregado /etc/nginx/sites-enabled/appcompregado
#   sudo nginx -t && sudo systemctl reload nginx
#
# Observação: /apiC/... é reescrito para /api/... no Spring Boot.
#   Ex.: https://appcompregado.com.br/apiC/anuncios  →  http://127.0.0.1:8080/api/anuncios
# =============================================================================================

upstream compregado_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name appcompregado.com.br www.appcompregado.com.br;

    # Challenge do Certbot (renovação sem derrubar o site)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/appcompregado;
        default_type "text/plain";
    }

    location / {
        return 301 https://appcompregado.com.br$request_uri;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.appcompregado.com.br;

    ssl_certificate     /etc/letsencrypt/live/appcompregado.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appcompregado.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://appcompregado.com.br$request_uri;
}

# Site institucional + proxy da API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name appcompregado.com.br;

    ssl_certificate     /etc/letsencrypt/live/appcompregado.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appcompregado.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:compregado_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/appcompregado;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # API ofuscada: /apiC/* → Spring Boot /api/*
    # Anúncios com fotos: até 55 MB
    client_max_body_size 55m;

    location = /apiC {
        return 301 /apiC/;
    }

    location /apiC/ {
        proxy_pass http://compregado_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Fotos salvas pela API (URLs públicas geradas com o Host do site)
    location /uploads/ {
        proxy_pass http://compregado_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        expires 7d;
    }

    # App Ionic (PWA) — publique o build em /var/www/appcompregado/app/
    location /app/ {
        alias /var/www/appcompregado/app/;
        try_files $uri $uri/ /app/index.html;
    }

    location = /app/index.html {
        expires -1;
    }

    # Landing estática
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$ {
        expires 30d;
        try_files $uri =404;
    }
}
