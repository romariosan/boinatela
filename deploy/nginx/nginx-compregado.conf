# =============================================================================================
# CompreGado — Nginx da VPS (instalado com apt, fora do Docker).
#
#   http://*                          -> 301 para https
#   https://www.appcompregado.com.br  -> 301 para https://appcompregado.com.br
#   https://appcompregado.com.br      -> build web do Ionic em /var/www/appcompregado
#   https://api.appcompregado.com.br  -> API Spring Boot no container (127.0.0.1:8080)
#
# Instalação (detalhes no README, "Deploy em produção"):
#   sudo cp deploy/nginx/nginx-compregado.conf /etc/nginx/sites-available/compregado.conf
#   sudo ln -sf /etc/nginx/sites-available/compregado.conf /etc/nginx/sites-enabled/compregado.conf
#   sudo rm -f /etc/nginx/sites-enabled/default      # este arquivo já tem o default_server da porta 80
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificado: um único certificado Let's Encrypt para os três nomes, emitido ANTES de ativar
# este arquivo (os blocos 443 exigem que ele exista):
#   sudo certbot certonly --standalone \
#     -d appcompregado.com.br -d www.appcompregado.com.br -d api.appcompregado.com.br \
#     --pre-hook "systemctl stop nginx" --post-hook "systemctl start nginx"
# Os hooks ficam gravados: a renovação automática (certbot.timer) para o Nginx por alguns segundos.
# =============================================================================================

# Tem que bater com API_PORT do deploy/.env.
upstream compregado_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

# --- Porta 80 -------------------------------------------------------------------------------
# Qualquer acesso HTTP aos três nomes vai para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name appcompregado.com.br www.appcompregado.com.br api.appcompregado.com.br;

    return 301 https://$host$request_uri;
}

# Acesso pelo IP ou por um domínio desconhecido: fecha a conexão sem resposta.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}

# --- www -> domínio principal -----------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.appcompregado.com.br;

    ssl_certificate     /etc/letsencrypt/live/appcompregado.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appcompregado.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:compregado_ssl:10m;
    ssl_session_timeout 1d;

    return 301 https://appcompregado.com.br$request_uri;
}

# --- Site (PWA / build web do Ionic) ----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name appcompregado.com.br;

    ssl_certificate     /etc/letsencrypt/live/appcompregado.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appcompregado.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:compregado_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Conteúdo de mobile/www (npx ng build --configuration production).
    root /var/www/appcompregado;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA: rotas do Angular (/tabs/tab1, /anuncio/12...) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html aponta para os arquivos da versão atual: nunca pode ficar em cache.
    location = /index.html {
        expires -1;
    }

    # JS e CSS do build têm hash no nome (main-XXXX.js): podem ficar em cache por muito tempo.
    location ~* \.(?:js|css)$ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$ {
        expires 7d;
        try_files $uri =404;
    }
}

# --- API Spring Boot ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.appcompregado.com.br;

    ssl_certificate     /etc/letsencrypt/live/appcompregado.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appcompregado.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:compregado_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Anúncio com fotos: até 52 MB por requisição na API (spring.servlet.multipart.max-request-size).
    client_max_body_size 55m;

    location / {
        proxy_pass http://compregado_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # A API monta as URLs das fotos a partir destes headers (server.forward-headers-strategy: native).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
