# Ativado com SPRING_PROFILES_ACTIVE=prod. Variáveis sem padrão: a API não sobe se faltarem.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  # Atrás do Nginx: as URLs das fotos usam o host e o https do X-Forwarded-*, não "127.0.0.1:8080".
  forward-headers-strategy: native

app:
  uploads:
    dir: ${UPLOADS_DIR:/data/uploads}
  jwt:
    # Mínimo de 32 caracteres (HS256).
    secret: ${JWT_SECRET}
  cors:
    # Site oficial + app nativo (Capacitor: https://localhost no Android, capacitor://localhost no iOS).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://appcompregado.com.br,https://www.appcompregado.com.br,https://localhost,capacitor://localhost}
  whatsapp:
    envio-no-log: false
