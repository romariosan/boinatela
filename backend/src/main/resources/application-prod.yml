# Ativado com SPRING_PROFILES_ACTIVE=prod. Variáveis sem padrão: a API não sobe se faltarem.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  # Atrás do Caddy: as URLs das fotos usam o host e o https do X-Forwarded-*, não "api:8080".
  forward-headers-strategy: native

app:
  uploads:
    dir: ${UPLOADS_DIR:/data/uploads}
  jwt:
    # Mínimo de 32 caracteres (HS256).
    secret: ${JWT_SECRET}
  cors:
    # Lista separada por vírgula, ex.: https://boinatela.com.br,https://localhost
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  whatsapp:
    envio-no-log: false
