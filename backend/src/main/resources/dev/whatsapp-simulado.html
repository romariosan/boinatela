<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WhatsApp simulado · CompreGado (local)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0b141a;
      color: #e9edef;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .aviso {
      background: #71502f;
      color: #fff;
      font-size: 13px;
      padding: 6px 16px;
      text-align: center;
    }
    .app { flex: 1; display: flex; min-height: 0; }
    .lado {
      width: 280px;
      border-right: 1px solid #222d34;
      background: #111b21;
      display: flex;
      flex-direction: column;
    }
    .lado h1 {
      margin: 0;
      padding: 16px;
      font-size: 17px;
      background: #1f4931;
    }
    .novo { padding: 12px; border-bottom: 1px solid #222d34; }
    .novo label { font-size: 12px; color: #8696a0; display: block; margin-bottom: 4px; }
    .novo input {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #2a3942;
      background: #202c33;
      color: inherit;
      font-size: 15px;
    }
    .contatos { flex: 1; overflow-y: auto; }
    .contato {
      padding: 14px 16px;
      border-bottom: 1px solid #1d282f;
      cursor: pointer;
    }
    .contato:hover, .contato.ativo { background: #2a3942; }
    .contato strong { display: block; font-size: 15px; }
    .contato span {
      display: block;
      font-size: 13px;
      color: #8696a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lado button.limpar {
      margin: 12px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #2a3942;
      background: transparent;
      color: #8696a0;
      cursor: pointer;
    }
    .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #0b141a; }
    .topo {
      padding: 12px 16px;
      background: #202c33;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      height: 38px;
      width: 38px;
      border-radius: 50%;
      background: #1f4931;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 14px;
    }
    .topo small { display: block; color: #8696a0; font-size: 12px; }
    .mensagens { flex: 1; overflow-y: auto; padding: 16px 6%; display: flex; flex-direction: column; gap: 6px; }
    .vazio { margin: auto; color: #8696a0; text-align: center; max-width: 360px; line-height: 1.5; }
    .balao {
      max-width: 70%;
      padding: 7px 10px 18px;
      border-radius: 8px;
      position: relative;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.4;
      font-size: 14.5px;
    }
    .balao.DO_BOT { align-self: flex-start; background: #202c33; }
    .balao.PARA_O_BOT { align-self: flex-end; background: #005c4b; }
    .balao time { position: absolute; right: 8px; bottom: 3px; font-size: 11px; color: #8696a0; }
    .codigo {
      background: #f7f3ea;
      color: #1f4931;
      font-weight: 700;
      padding: 0 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .codigo:hover { outline: 2px solid #22c55e; }
    form.compor { display: flex; gap: 8px; padding: 10px 16px; background: #202c33; }
    form.compor input {
      flex: 1;
      padding: 11px 14px;
      border-radius: 8px;
      border: none;
      background: #2a3942;
      color: inherit;
      font-size: 15px;
    }
    form.compor button {
      padding: 0 20px;
      border: none;
      border-radius: 8px;
      background: #00a884;
      color: #0b141a;
      font-weight: 700;
      cursor: pointer;
    }
    form.compor button:disabled { opacity: 0.5; cursor: default; }
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #e9edef;
      color: #0b141a;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.visivel { opacity: 1; }
  </style>
</head>
<body>
  <div class="aviso">Ambiente local: nenhuma mensagem sai de verdade. Esta página não existe em produção.</div>
  <div class="app">
    <aside class="lado">
      <h1>WhatsApp simulado</h1>
      <div class="novo">
        <label for="numero">Você é o celular (DDD + número)</label>
        <input id="numero" inputmode="numeric" placeholder="61999999999" autocomplete="off" />
      </div>
      <div class="contatos" id="contatos"></div>
      <button class="limpar" id="limpar" type="button">Apagar todas as conversas</button>
    </aside>
    <main class="chat">
      <div class="topo">
        <span class="avatar" aria-hidden="true">CG</span>
        <div>
          <strong>Bot CompreGado</strong>
          <small id="subtitulo">Escolha ou digite um número ao lado</small>
        </div>
      </div>
      <div class="mensagens" id="mensagens"></div>
      <form class="compor" id="compor">
        <input id="texto" placeholder="Mensagem para o bot" autocomplete="off" />
        <button type="submit" id="enviar">Enviar</button>
      </form>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const API = '/dev/whatsapp/mensagens';
    const CODIGO = /(CG-\d{6}|\b\d{4}\b)/gi;
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    let todas = [];
    let ultimoId = -1;

    const digitos = valor => (valor || '').replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, '');
    const formatar = n => n.length === 11 ? `(${n.slice(0, 2)}) ${n.slice(2, 7)}-${n.slice(7)}`
      : n.length === 10 ? `(${n.slice(0, 2)}) ${n.slice(2, 6)}-${n.slice(6)}` : n;
    const hora = iso => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

    $('numero').value = digitos(params.get('numero'));
    $('texto').value = params.get('texto') || '';

    function avisar(texto) {
      $('toast').textContent = texto;
      $('toast').classList.add('visivel');
      clearTimeout(avisar.t);
      avisar.t = setTimeout(() => $('toast').classList.remove('visivel'), 1800);
    }

    function comCodigosDestacados(texto, destino) {
      let inicio = 0;
      for (const achado of texto.matchAll(CODIGO)) {
        destino.append(texto.slice(inicio, achado.index));
        const codigo = document.createElement('span');
        codigo.className = 'codigo';
        codigo.title = 'Clique para copiar';
        codigo.textContent = achado[0];
        codigo.onclick = () => navigator.clipboard.writeText(achado[0]).then(() => avisar(`Copiado: ${achado[0]}`));
        destino.append(codigo);
        inicio = achado.index + achado[0].length;
      }
      destino.append(texto.slice(inicio));
    }

    function renderizarContatos() {
      const atual = digitos($('numero').value);
      const ultimas = new Map();
      for (const m of todas) ultimas.set(m.numero, m);
      const lista = $('contatos');
      lista.replaceChildren();
      [...ultimas.values()].reverse().forEach(m => {
        const item = document.createElement('div');
        item.className = 'contato' + (m.numero === atual ? ' ativo' : '');
        const nome = document.createElement('strong');
        nome.textContent = formatar(m.numero);
        const previa = document.createElement('span');
        previa.textContent = (m.direcao === 'PARA_O_BOT' ? 'Você: ' : '') + m.texto;
        item.append(nome, previa);
        item.onclick = () => { $('numero').value = m.numero; renderizar(true); };
        lista.append(item);
      });
    }

    function renderizar(forcar) {
      const atual = digitos($('numero').value);
      $('subtitulo').textContent = atual.length >= 10
        ? `Conversa com ${formatar(atual)}`
        : 'Escolha ou digite um número ao lado';
      renderizarContatos();
      const conversa = todas.filter(m => m.numero === atual);
      const ultimo = conversa.length ? conversa[conversa.length - 1].id : 0;
      if (!forcar && ultimo === ultimoId) return;
      ultimoId = ultimo;

      const caixa = $('mensagens');
      caixa.replaceChildren();
      if (!conversa.length) {
        const vazio = document.createElement('p');
        vazio.className = 'vazio';
        vazio.textContent = atual.length >= 10
          ? 'Nenhuma mensagem com este número ainda. Peça um código no app ou envie o código CG- do cadastro.'
          : 'Digite ao lado o WhatsApp usado no app para ver as mensagens do bot.';
        caixa.append(vazio);
        return;
      }
      for (const m of conversa) {
        const balao = document.createElement('div');
        balao.className = `balao ${m.direcao}`;
        comCodigosDestacados(m.texto, balao);
        const quando = document.createElement('time');
        quando.textContent = hora(m.quando);
        balao.append(quando);
        caixa.append(balao);
      }
      caixa.scrollTop = caixa.scrollHeight;
    }

    async function atualizar() {
      try {
        const resposta = await fetch(API);
        if (resposta.ok) {
          todas = await resposta.json();
          renderizar(false);
        }
      } catch { /* API reiniciando: tenta no próximo ciclo */ }
    }

    $('numero').addEventListener('input', () => renderizar(true));

    $('compor').addEventListener('submit', async evento => {
      evento.preventDefault();
      const numero = digitos($('numero').value);
      const texto = $('texto').value.trim();
      if (numero.length < 10) { avisar('Informe o número com DDD ao lado.'); $('numero').focus(); return; }
      if (!texto) return;
      $('enviar').disabled = true;
      try {
        const resposta = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ numero, texto }),
        });
        if (!resposta.ok) throw new Error();
        $('texto').value = '';
        history.replaceState(null, '', `?numero=${numero}`);
        await atualizar();
        setTimeout(atualizar, 700);
      } catch {
        avisar('Não foi possível enviar. A API está no ar?');
      } finally {
        $('enviar').disabled = false;
      }
    });

    $('limpar').addEventListener('click', async () => {
      if (!confirm('Apagar todas as conversas simuladas?')) return;
      await fetch(API, { method: 'DELETE' });
      await atualizar();
      renderizar(true);
    });

    renderizar(true);
    atualizar();
    setInterval(atualizar, 1500);
  </script>
</body>
</html>
