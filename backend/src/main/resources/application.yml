spring:
  application:
    name: compregado
  datasource:
    url: jdbc:postgresql://localhost:5432/compregado
    username: compregado
    password: compregado
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 52MB

server:
  port: 8080

gemini:
  api:
    # Chave só por ambiente (GEMINI_API_KEY). Vazio = o ouvinte grava o texto original, sem chamar a IA.
    key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

whatsapp:
  api:
    url: ${WHATSAPP_API_URL:http://localhost:8080/evolution-api}
    key: ${WHATSAPP_API_KEY:}

compregado:
  app:
    googleplay:
      url: https://play.google.com/store/apps/details?id=br.com.appcompregado
  web:
    base-url: https://appcompregado.com.br
  whatsapp:
    # Chip 1 manda OTP. Chip 2 só escuta grupo. Chip 3 manda a prospecção.
    system:
      number: ${COMPREGADO_WHATSAPP_SYSTEM_NUMBER:5561999999991}
      instance: ${COMPREGADO_WHATSAPP_SYSTEM_INSTANCE:compregado-system}
    scraper:
      number: ${COMPREGADO_WHATSAPP_SCRAPER_NUMBER:5561999999992}
      instance: ${COMPREGADO_WHATSAPP_SCRAPER_INSTANCE:compregado-scraper}
    consultant:
      number: ${COMPREGADO_WHATSAPP_CONSULTANT_NUMBER:5561999999993}
      instance: ${COMPREGADO_WHATSAPP_CONSULTANT_INSTANCE:compregado-consultant}
  consultor:
    # A cada minuto, pega o que completou 30 minutos. "-" desliga.
    cron: "0 * * * * ?"
  retencao:
    dias: 15
    # Todo dia às 9h (Brasília). "-" desliga.
    cron: "0 0 9 * * ?"
  radar:
    enabled: true
  limite:
    anuncios:
      # Anúncios ATIVOS por vendedor sem plano PRO (isPremium). Em produção: COMPREGADO_LIMITE_ANUNCIOS_GRATIS.
      gratis: 3
  assinatura:
    # Expiração do plano PRO (AssinaturaJobService), horário de Brasília. "-" desliga.
    cron: "0 1 0 * * ?"

app:
  uploads:
    dir: uploads
  jwt:
    secret: "compregado-dev-secret-key-mude-em-producao-256bits!"
    expiration-ms: 86400000
  whatsapp:
    # Sem valor, POST /api/webhook/whatsapp responde 503. Nunca deixar um padrão fixo aqui.
    webhook-token: ${WHATSAPP_WEBHOOK_TOKEN:}
    # Evolution API: URL base, chave (apikey), instância e número conectado (com DDI).
    bot-url: ${WHATSAPP_BOT_URL:}
    bot-token: ${WHATSAPP_BOT_TOKEN:}
    bot-instancia: ${WHATSAPP_BOT_INSTANCIA:compregado}
    bot-numero: ${WHATSAPP_BOT_NUMERO:}
    # true só em desenvolvimento sem bot: o código do "Esqueci minha senha" vai para o log.
    envio-no-log: ${WHATSAPP_ENVIO_NO_LOG:false}
  cors:
    allowed-origins:
      - http://localhost:8100
      - http://localhost:4200
      - http://127.0.0.1:8100
