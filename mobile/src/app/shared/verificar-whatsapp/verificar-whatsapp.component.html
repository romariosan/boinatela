<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Confirmar WhatsApp</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="fechar()">Agora não</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="conteudo">
    <ion-icon class="icone" name="shield-checkmark-outline" aria-hidden="true"></ion-icon>
    <h2>Digite o código do WhatsApp</h2>
    <p class="mensagem">
      Vamos mandar um código de 6 dígitos para o WhatsApp desta conta. Ele vale por 10 minutos.
    </p>

    <ion-button expand="block" class="botao-whatsapp" (click)="enviarCodigo()" [disabled]="enviando || reenviarEm > 0">
      <ion-spinner *ngIf="enviando" slot="start" name="crescent"></ion-spinner>
      <ion-icon *ngIf="!enviando" slot="start" name="logo-whatsapp"></ion-icon>
      {{ reenviarEm > 0 ? 'Reenviar código em ' + reenviarEm + 's' : 'Enviar código' }}
    </ion-button>

    <ion-input
      class="campo-codigo"
      fill="outline"
      label="Código"
      labelPlacement="stacked"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      placeholder="000000"
      [(ngModel)]="codigo"
    ></ion-input>

    <ion-button expand="block" (click)="confirmar()" [disabled]="confirmando || !codigoValido">
      <ion-spinner *ngIf="confirmando" slot="start" name="crescent"></ion-spinner>
      Confirmar
    </ion-button>
    <p class="erro" *ngIf="erro" role="alert">{{ erro }}</p>
  </div>
</ion-content>
